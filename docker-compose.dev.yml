services:
    db:
        image: postgres:16
        container_name: alemeno_database
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: db
        ports:
            - '5432:5432'
        volumes:
            - ./pgdata:/var/lib/postgresql/data
    redis:
        image: redis:7
        container_name: alemeno_redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - ./redis-data:/data

volumes:
    pgdata:
    redis-data: